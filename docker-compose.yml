version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: InfoSecRelax_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: infosecrelax_root_password
      MYSQL_DATABASE: infosecrelax
      MYSQL_USER: infosecrelax_user
      MYSQL_PASSWORD: infosecrelax_password
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: InfoSecRelax_web
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: infosecrelax
      MYSQL_USER: infosecrelax_user
      MYSQL_PASSWORD: infosecrelax_password
    ports:
      - "8090:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
